services:
  - type: web
    name: beialert-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m src.train"
    startCommand: "uvicorn src.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Pinned: numpy 1.26 / pandas 2.2 have no wheels for Render's newer default.
      - key: PYTHON_VERSION
        value: 3.10.12
